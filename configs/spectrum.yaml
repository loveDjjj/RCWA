geometry:
  unit: um
  period_um: [2.8, 2.8]
  pillar_side_um: 1.5
  pillar_thickness_um: 0.6
  film_thickness_um: 0.3
  edge_sharpness: 1000.0

materials:
  structure_name: ZnS
  structure_csv: database/ZnS.csv
  substrate_name: Si
  substrate_csv: database/Si.csv
  csv_wavelength_unit: um

scan:
  wavelength_um:
    start: 2.0
    stop: 8.0
    points: 300
  angle_deg:
    start: 0.0
    stop: 89
    points: 90
  polarization: both

rcwa:
  fourier_order: 7
  grid: [256, 256]
  batch_size: 200
  max_batch_elements: 200
  linalg_batch_mode: batched
  linalg_batch_threshold: 2048
  azimuth_deg: 0.0

runtime:
  cpu: false
  double_precision: false
  run_spectrum: false
  run_angle_sweep: true

output:
  spectrum_csv: rcwa_spectrum.csv
  spectrum_fig: rcwa_spectrum.png
  angle_csv: rcwa_angle_sweep.csv
  angle_fig: rcwa_angle_maps.png
  no_plots: false
