  direction: backward
  offset_above_structure_um: 1.2

monitors:
  reflection_offset_um: 1.7
  transmission_y_um: -1.5
  save_raw_flux: true

runtime:
  lumapi_dir: C:\Program Files\Lumerical\v202\api\python
  smoke_mode: build_only

output:
  save_fsp: true
  save_csv: false
  save_png: false
  save_json: true
